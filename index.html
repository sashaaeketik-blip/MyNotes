
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#15151d">
<title>MyNotes</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 25px 18px;
  background: #15151d;
  color: #fff;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 15px 0 30px;
}
h1 { font-size: 30px; margin: 0; }
.subtitle { color: #9997a8; font-size: 13px; }
button {
  border: 0;
  border-radius: 13px;
  padding: 13px 18px;
  background: #8b69d9;
  color: white;
  font-size: 15px;
  cursor: pointer;
}
#notes {
  display: grid;
  gap: 13px;
  margin-top: 22px;
}
.note {
  background: #242431;
  border-radius: 16px;
  padding: 18px;
}
.note h3 { margin: 0 0 9px; }
.note p {
  color: #aaa8b7;
  white-space: pre-wrap;
  margin: 0;
}
.delete {
  background: #393442;
  margin-top: 14px;
  font-size: 12px;
}
.empty {
  color: #9997a8;
  text-align: center;
  margin-top: 65px;
}
</style>
</head>
<body>
<header>
  <div>
    <h1>MyNotes</h1>
    <div class="subtitle">Твоё личное пространство</div>
  </div>
  <button onclick="addNote()">+</button>
</header>

<div class="subtitle">МОИ ЗАМЕТКИ</div>
<div id="notes"></div>

<script>
let notes = JSON.parse(localStorage.getItem("mynotes") || "[]");

function save() {
  localStorage.setItem("mynotes", JSON.stringify(notes));
}

function addNote() {
  const title = prompt("Название заметки:");
  if (title === null || !title.trim()) return;

  const text = prompt("Текст заметки:");
  if (text === null) return;

  notes.unshift({
    id: Date.now(),
    title: title.trim(),
    text: text
  });

  save();
  render();
}

function deleteNote(id) {
  notes = notes.filter(note => note.id !== id);
  save();
  render();
}

function render() {
  const container = document.getElementById("notes");
  container.innerHTML = "";

  if (notes.length === 0) {
    container.innerHTML = '<div class="empty">Пока здесь пусто.<br>Создай свою первую заметку!</div>';
    return;
  }

  notes.forEach(note => {
    const card = document.createElement("div");
    card.className = "note";

    const title = document.createElement("h3");
    title.textContent = note.title;

    const content = document.createElement("p");
    content.textContent = note.text;

    const button = document.createElement("button");
    button.className = "delete";
    button.textContent = "Удалить";
    button.onclick = () => deleteNote(note.id);

    card.append(title, content, button);
    container.appendChild(card);
  });
}

render();
</script>
</body>
</html>
